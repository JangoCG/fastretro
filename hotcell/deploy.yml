# Shared SaaS settings. Merge into config/deploy.yml; read the image through HotcellImage.pinned.
# bin/build updates this literal pin; commit it with the cell's inputs and lockfile.
hooks_path: hotcell/hooks
hooks_output:
  pre-build: verbose
  pre-deploy: verbose

builder:
  target: saas

servers:
  web:
    options:
      group-add: 10001
      publish: "127.0.0.1::9394"
  jobs:
    cmd: bin/jobs
    options:
      group-add: 10001
      publish: "127.0.0.1::9394"

env:
  clear:
    HOTCELL_ROOT: /run/hotcell
    HOTCELL_GROUP: 10001

volumes:
  - hotcell-active-storage:/run/hotcell/active_storage

accessories:
  hotcell:
    image: localhost:5555/fastretro-hotcell:0542e5679843
    roles: [ web, jobs ]
    network: none
    volumes:
      - hotcell-active-storage:/run/hotcell/cell
    options:
      cpus: 2
      memory: 2g
      memory-swap: 2g
      read-only: true
      cap-drop: ALL
      security-opt: no-new-privileges:true
      user: 10001:10001
      pids-limit: 512
      tmpfs: /tmp:rw,nosuid,nodev,noexec,size=512m
